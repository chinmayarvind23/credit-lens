[project]
name = "creditlens"
version = "0.1.0"
description = "Permission-aware lending evidence and underwriting preparation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
