[project]
name = "creditlens"
version = "0.1.0"
description = "Permission-aware lending evidence and underwriting preparation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "pyjwt[crypto]>=2.10,<3",
    "pypdf>=6,<7",
    "redis>=6,<8",
    "reportlab>=4,<5",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
queue = ["boto3>=1.43.92,<2", "boto3-stubs[sqs]>=1.43.92,<2"]
retrieval = [
    "faiss-cpu>=1.12,<2",
    "llama-index-core>=0.14,<1",
    "llama-index-embeddings-huggingface>=0.6,<1",
    "numpy>=2,<3",
    "sentence-transformers>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
 "pytest-cov>=6,<7",
 "ruff>=0.12,<1",
 "mypy>=1.17,<2",
 "types-reportlab>=4,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"infra/redis/test_integration.py" = ["S101"]
"infra/postgres/test_catalog.py" = ["S101"]
"infra/postgres/test_ingestion_jobs.py" = ["S101"]
"infra/postgres/test_ingestion_execution.py" = ["S101"]
"infra/postgres/test_queue_execution.py" = ["S101"]
"infra/huggingface/sdk_tests/test_publish_sdk.py" = ["S101"]
"infra/ocr/tests/test_experiments.py" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
