name: CreditLens quality

on:
  # No-spend mode: private-repository hosted minutes must not run automatically.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COVERAGE_FILE: ${{ runner.temp }}/creditlens-coverage-data
      CREDITLENS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:creditlens-test-only@127.0.0.1:5432/creditlens_test
      CREDITLENS_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      CREDITLENS_TEST_SQS_ENDPOINT: http://127.0.0.1:19324
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_PASSWORD: creditlens-test-only
          POSTGRES_DB: creditlens_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d creditlens_test" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.4"
          python-version: "3.11"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install locked dependencies
        run: |
          uv sync --locked --extra queue --extra retrieval --extra observability --extra admin
          bun install --cwd apps/web --frozen-lockfile
      - name: Python static checks
        run: |
          uv run --no-sync ruff check src tests scripts infra/huggingface infra/postgres infra/sqs .github/scripts .github/tests
          uv run --no-sync ruff format --check src tests scripts infra/huggingface infra/postgres infra/sqs .github/scripts .github/tests
          uv run --no-sync mypy src scripts/deploy_space.py scripts/ingest_documents.py scripts/inspect_admin.py scripts/index_weaviate.py scripts/index_opensearch.py infra/sqs/wait_ready.py infra/huggingface/demo_entrypoint.py infra/huggingface/smoke_container.py .github/scripts/check_coverage.py
      - name: Verify the sanitized deployment snapshot
        run: |
          uv run --no-sync python scripts/deploy_space.py stage --output "${{ runner.temp }}/creditlens-space"
          uv run --no-sync python scripts/deploy_space.py verify --stage "${{ runner.temp }}/creditlens-space"
      - name: Build the demo and isolated parser image
        run: |
          docker build --tag creditlens-demo:ci "${{ runner.temp }}/creditlens-space"
          echo "CREDITLENS_TEST_PARSER_IMAGE=$(docker image inspect --format '{{.Id}}' creditlens-demo:ci)" >> "$GITHUB_ENV"
      - name: Start the local SQS-compatible fixture
        run: |
          docker run --detach --rm --name creditlens-sqs-ci --memory 256m --cpus 1 --pids-limit 128 --read-only --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=32m --tmpfs /data:rw,noexec,nosuid,size=32m,uid=1000,gid=1000 --publish 127.0.0.1:19324:9324 --mount type=bind,source=${{ github.workspace }}/infra/sqs/elasticmq.conf,target=/opt/elasticmq.conf,readonly softwaremill/elasticmq-native@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
          uv run --no-sync python infra/sqs/wait_ready.py
      - name: Python and package boundary tests
        run: uv run --no-sync pytest tests infra/huggingface/tests infra/postgres .github/tests --ignore=tests/test_retrieval_lab.py --cov=creditlens --cov-report=term-missing -o cache_dir=${{ runner.temp }}/creditlens-pytest-cache --cov-report=xml:${{ runner.temp }}/coverage.xml --cov-report=json:${{ runner.temp }}/coverage.json
      - name: Enforce reviewed line coverage
        run: uv run python .github/scripts/check_coverage.py --report "${{ runner.temp }}/coverage.json" --output "${{ runner.temp }}/coverage-gate.json"
      - name: Frontend checks
        working-directory: apps/web
        run: |
          bun run typecheck
          bun run test
          bun run build
          bun run build:preview
          bun audit
      - name: Generate the synthetic evaluation corpus
        run: uv run python scripts/build_corpus.py --output "${{ runner.temp }}/creditlens-corpus" --borrowers 200
      - name: Regenerate the reviewed lexical control
        env:
          CONTROL_REVISION: 5d6d6ab840e8a498bf202582d1d3c5d5da62ddaa
        run: |
          git worktree add --detach "${{ runner.temp }}/creditlens-reference" "$CONTROL_REVISION"
          cd "${{ runner.temp }}/creditlens-reference"
          uv run --locked python scripts/evaluate.py --pages "${{ runner.temp }}/creditlens-corpus/pages.jsonl" --output "${{ runner.temp }}/creditlens-control" --outcomes
      - name: Run frozen local evaluation gates
        run: uv run python scripts/evaluate.py --pages "${{ runner.temp }}/creditlens-corpus/pages.jsonl" --output "${{ runner.temp }}/creditlens-eval" --outcomes --baseline "${{ runner.temp }}/creditlens-control/summary.json"
      - name: Gate response equivalence, audit, telemetry and HTTP latency
        run: uv run --no-sync python -m scripts.benchmark_response_cache --output "${{ runner.temp }}/creditlens-response-cache"
      - name: Exercise the built container
        run: |
          docker run --detach --name creditlens-demo-ci --publish 127.0.0.1:17860:7860 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /app/data:rw,noexec,nosuid,size=64m,uid=1000,gid=1000 --tmpfs /tmp:rw,noexec,nosuid,size=32m --cpus 1 --memory 512m --pids-limit 128 creditlens-demo:ci
          uv run python infra/huggingface/smoke_container.py --base-url http://127.0.0.1:17860
      - name: Stop the test container
        if: always()
        run: |
          if docker container inspect creditlens-demo-ci >/dev/null 2>&1; then
            docker logs creditlens-demo-ci
            docker rm --force creditlens-demo-ci
          fi
          if docker container inspect creditlens-sqs-ci >/dev/null 2>&1; then
            docker rm --force creditlens-sqs-ci
          fi
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: creditlens-verification
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/coverage.xml
            ${{ runner.temp }}/coverage.json
            ${{ runner.temp }}/coverage-gate.json
            ${{ runner.temp }}/creditlens-control/
            ${{ runner.temp }}/creditlens-eval/
            ${{ runner.temp }}/creditlens-space/deployment-manifest.json
          retention-days: 14

  retrieval-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.4"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked optional retrieval dependencies
        run: uv sync --locked --extra retrieval
      - name: Require actual numeric and parser dependencies
        run: uv run --no-sync python -c "import numpy; import faiss; import llama_index.core"
      - name: Exercise optional retrieval contracts without model downloads
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run --no-sync pytest tests/test_retrieval_lab.py tests/test_lab_evidence.py

  redis-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.8.4"
          python-version: "3.11"
      - run: uv sync --locked
      - name: Exercise actual Redis expiry and canonical cache hydration
        env:
          CREDITLENS_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: uv run pytest infra/redis/test_integration.py
