syntax = "proto3";
package creditlens.v1;

// Internal evidence preparation. Authorization travels in gRPC metadata.
service Underwriting {
  rpc Query(QueryRequest) returns (PacketResponse);
}

message QueryRequest {
  string borrower_id = 1;
  string question = 2;
  string effective_at = 3; // ISO 8601 calendar date, validated by the Python domain model.
}

message PacketResponse {
  uint32 schema_version = 1;
  bytes packet_json = 2; // UTF-8 Pydantic Packet JSON, including exact Decimal strings and citations.
}
