global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: creditlens-synthetic
    scrape_timeout: 3s
    static_configs:
      - targets: [host.docker.internal:19101]
        labels:
          environment: local-synthetic
  - job_name: creditlens-eval-ragas
    scrape_timeout: 3s
    static_configs:
      - targets: [host.docker.internal:19102]
        labels:
          environment: local-evaluation-snapshot
  - job_name: creditlens-eval-deepeval
    scrape_timeout: 3s
    static_configs:
      - targets: [host.docker.internal:19103]
        labels:
          environment: local-evaluation-snapshot
  - job_name: creditlens-indexing-snapshot
    scrape_timeout: 3s
    static_configs:
      - targets: [host.docker.internal:19104]
        labels:
          environment: local-indexing-snapshot
  - job_name: creditlens-neural-operation-snapshot
    scrape_timeout: 3s
    static_configs:
      - targets: [host.docker.internal:19105]
        labels:
          environment: local-neural-fault-drill
  - job_name: creditlens-publication-visibility-snapshot
    scrape_timeout: 3s
    static_configs:
      - targets: [host.docker.internal:19106]
        labels:
          environment: local-sql-publication-drill
